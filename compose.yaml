services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: oficina
      MYSQL_USER: oficina
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes: ["oficina-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    ports: ["127.0.0.1:8083:8000"]
    environment:
      APP_NAME: Oficina
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Gere APP_KEY com php artisan key:generate}
      APP_URL: http://localhost:8083
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: oficina
      DB_USERNAME: oficina
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
    depends_on:
      db: {condition: service_healthy}
volumes:
  oficina-data:
